<div id="about-tab" class="col s12">
  <div class="col s6">
    <div class="row label-row">
      <div class="col s3 label-key"><p>Version</p></div>
      <div class="col s3"><p id="app-version"></p></div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p>Licence</p></div>
      <div class="col s3"><p>MIT</p></div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p>Star Me</p></div>
      <div class="col s3">
        <p>
          <a href="https://gitee.com/xenkuo/comNG" id="star-me">Star ME!</a>
        </p>
      </div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p>Feedback</p></div>
      <div class="col s9">
        <p>
          <a href="https://gitee.com/xenkuo/comNG/issues" id="issue"
            >Feedback</a
          >
        </p>
      </div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p>Documents</p></div>
      <div class="col s9">
        <p>
          <a
            href="https://gitee.com/xenkuo/comNG/blob/master/doc/Introduction.md"
            id="comnglang"
            >User Manual</a
          >
        </p>
      </div>
    </div>
    <div class="row label-row">
      <div class="col s4 config-key"><p>Preview</p></div>
      <div class="col s8 config-item">
        <div class="switch">
          <label>
            Off
            <input type="checkbox" id="insider-preview" />
            <span class="lever"></span>
            On
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="col s6 image">
    <div align="center">
      <p class="config-key">Donation</p>
      <img src="../image/donation.png" />
    </div>
  </div>
</div>
