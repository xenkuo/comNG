<div id="fileops-tab" class="col s12">
  <div class="col s12">
    <blockquote i18n-label="capture2File"></blockquote>
    <div class="divider"></div>
    <div class="row config-row">
      <div class="col s3 config-item">
        <div class="switch">
          <label>
            Off
            <input type="checkbox" id="capture-file-switch" />
            <span class="lever"></span>
            On
          </label>
        </div>
      </div>
      <div class="input-field col s9">
        <input
          readonly
          value=""
          placeholder="Capture File Path"
          id="capture-file-path"
          type="text"
        />
      </div>
    </div>
  </div>
  <div class="col s12">
    <blockquote i18n-label="shortcuts">Shortcuts</blockquote>
    <div class="divider"></div>
    <div class="row">
      <div class="col s6">
        <table id="shortcuts-fileops-table">
          <tbody></tbody>
        </table>
      </div>
      <div class="col s6">
        <table id="shortcuts-general-table">
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
