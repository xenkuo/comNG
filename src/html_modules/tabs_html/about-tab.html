<div id="about-tab" class="col s12">
  <div class="col s6">
    <div class="row label-row">
      <div class="col s3 label-key"><p i18n-label="version">Version</p></div>
      <div class="col s3"><p id="app-version"></p></div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p i18n-label="license"></p></div>
      <div class="col s3"><p>MIT</p></div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p i18n-label="starMe">Star Me</p></div>
      <div class="col s3">
        <p>
          <a href="https://gitee.com/xenkuo/comNG" id="gitee-star">Gitee</a>
          <span> <b>|</b> </span>
          <a href="https://github.com/xenkuo/comNG" id="github-star">Github</a>
        </p>
      </div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p i18n-label="feedback">Feedback</p></div>
      <div class="col s9">
        <p>
          <a href="https://gitee.com/xenkuo/comNG/issues" id="issue"
            >加右侧微信入群 or Gitee Issue</a
          >
        </p>
      </div>
    </div>
    <div class="row label-row">
      <div class="col s3 label-key"><p i18n-label="documents">Documents</p></div>
      <div class="col s9">
        <p>
          <a
            i18n-label="userManual"
            href="https://gitee.com/xenkuo/comNG/blob/master/doc/Introduction.md"
            id="documents"
            >User Manual</a
          >
        </p>
      </div>
    </div>
    <div class="row label-row">
      <div class="col s4 config-key"><p i18n-label="tryPreviewVersion">Preview</p></div>
      <div class="col s8 config-item">
        <div class="switch">
          <label>
            Off
            <input type="checkbox" id="insider-preview" />
            <span class="lever"></span>
            On
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="col s6 image">
    <div align="center">
      <img src="../image/friends.png" style="max-height: 340px" />
    </div>
  </div>
</div>
