<!doctype html>
<html lang="en" xml:lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>comNG</title>
    <link rel="stylesheet" href="index.css" />
    <meta />
  </head>

  <body>
    <div id="nav-area-placeholder"></div>
    <script src="fragment-loader.js"></script>

    <div id="editor-area"></div>

    <div id="menu-area" hidden>
      <div class="row" id="menu-handle"></div>

      <div class="row" id="menu-tabs-body">
        <div class="row" id="menu-tabs-row">
          <ul class="tabs" id="menu-tabs">
            <li class="tab col s2">
              <a i18n-label="general" class="active" href="#general-tab"></a>
            </li>
            <li class="tab col s2"><a i18n-label="transmit" href="#transmit-tab"></a></li>
            <li class="tab col s2"><a i18n-label="advance" href="#advance-tab"></a></li>
            <li class="tab col s2"><a i18n-label="fileops" href="#fileops-tab"></a></li>
            <li class="tab col s2"><a i18n-label="chart" href="#chart-tab"></a></li>
            <li class="tab col s2"><a i18n-label="about" href="#about-tab"></a></li>
          </ul>
        </div>

        <div id="general-tab-placeholder"></div>
        <div id="transmit-tab-placeholder"></div>
        <div id="advance-tab-placeholder"></div>
        <div id="fileops-tab-placeholder"></div>
        <div id="chart-tab-placeholder"></div>
        <div id="about-tab-placeholder"></div>
        <!-- Tab fragments loaded by fragment-loader.js -->
      </div>
    </div>

    <div id="bar-area-placeholder"></div>

    <!-- You can also require other files to run in this process -->
    <script>
      var indexScript = document.createElement('script')
      indexScript.src = 'index.js'
      indexScript.onload = function () {
        setTimeout(function () {
          var hmScript = document.createElement('script')
          hmScript.src = 'modules/hm.js'
          hmScript.async = true
          document.body.appendChild(hmScript)
        }, 5000)
      }
      document.body.appendChild(indexScript)
    </script>
  </body>
</html>
